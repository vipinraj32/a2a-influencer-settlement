[project]
name = "zyroxq"
version = "0.1.0"
description = "Agent-negotiated influencer deals with escrow-backed payouts settled through HashKey HSP"
readme = "README.md"
authors = [
    { name = "vipinraj32", email = "vipendrarajpoot2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.3.0",
    "cryptography>=50.0.2",
    "eth-account>=0.14.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2",
    "langchain>=1.0",
    "langchain-anthropic>=1.7.7",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.14",
    "mcp>=1.30.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "web3>=8.0.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
zyroxq = "zyroxq:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "py-solc-x>=2.0.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/test_negotiation_api.py" = ["F811"]
"tests/test_youtube_profile.py" = ["F811"]
"tests/test_niche.py" = ["F811"]
"tests/test_proof_review.py" = ["F811"]
"tests/test_negotiation_stream.py" = ["F811"]
"tests/test_database_outage.py" = ["F811"]
"tests/test_content_agent.py" = ["F811"]  # reuses test_e2e's fixtures by importing them
