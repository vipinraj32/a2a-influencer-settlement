[project]
name = "zyroxq"
version = "0.1.0"
description = "Agent-negotiated influencer deals with escrow-backed payouts settled through HashKey HSP"
readme = "README.md"
authors = [
    { name = "vipinraj32", email = "vipendrarajpoot2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.3.0",
    "cryptography>=50.0.2",
    "eth-account>=0.14.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.0",
    "langchain-anthropic>=1.7.7",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.14",
    "mcp>=1.30.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "web3>=8.0.0",
]

[project.scripts]
zyroxq = "zyroxq:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
